select,input,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}.stat span{color:var(--mute);font-size:.82rem}
.alert{background:#fdecea;color:#8c1d14;border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-weight:500}

.loan:first-of-type{border-top:0}
.loan .m{color:var(--mute);font-size:.88rem}

.err{color:var(--bad);min-height:1.4em;margin:8px 0 0}
.auth{max-width:380px;margin:8vh auto}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}

document.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>upd(b.dataset.al,l=>{if(isAdmin()){l.req=false;delete l.reqOn}}));
document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>upd(b.dataset.up,l=>{if(isAdmin()){l.paid=false;l.req=false;delete l.paidOn;delete l.reqOn}}));
document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=async()=>{const l0=loans().find(x=>x.id===b.dataset.ed);if(!l0)return;if(!isAdmin()&&(l0.paid||l0.req||l0.owner!==cur))return;
const v=await dlg({title:t("edit")+" — "+l0.name,fields:[{id:"n",label:t("name"),value:l0.name,req:1,msg:t("eName")},{id:"d",label:t("due"),type:"date",value:l0.due}],ok:t("saveB"),check:v=>v.d<l0.start?t("eDue"):""});if(!v)return;
upd(l0.id,l=>{l.name=v.n;l.due=v.d;l.days=Math.max(1,diff(l.due,l.start))})});
document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{const x=loans().find(z=>z.id===b.dataset.dl);if(!x||!canDelete()||(!isAdmin()&&(x.owner!==cur||x.paid||x.req)))return;if(await dlg({title:t("del"),text:t("sure")+" — "+x.name,ok:t("del"),danger:1})){store("loans",loans().filter(z=>z.id!==x.id));main()}});
document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{const u=users(),x=u.find(z=>z.name===b.dataset.pf);x.profit=!x.profit;store("users",u);main()});
document.querySelectorAll("[data-cap]").forEach(b=>b.onclick=async()=>{if(!isAdmin())return;const u=users(),x=u.find(z=>z.name===b.dataset.cap);if(!x)return;
const v=await dlg({title:t("cap0")+" — "+x.name,fields:[{id:"v",label:t("cap0"),value:x.cap===undefined?"":String(x.cap),num:1,req:1,msg:t("eAmt")}],ok:t("saveB")});if(!v)return;
x.cap=Math.max(0,v.v);store("users",u);main()});
document.querySelectorAll("[data-fnd]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;const[a,c]=b.dataset.fnd.split("|").map(decodeURIComponent),u=users(),x=u.find(z=>z.name===a);if(!x)return;const f=x.funds||[];x.funds=f.includes(c)?f.filter(n=>n!==c):f.concat([c]);store("users",u);main()});
document.querySelectorAll("[data-sel]").forEach(b=>b.onchange=()=>{b.checked?selD.add(b.dataset.sel):selD.delete(b.dataset.sel);const bt=$("delSel");if(bt){bt.disabled=!selD.size;bt.textContent=t("delSel")+" ("+selD.size+")"}const sa=$("selAll");if(sa)sa.checked=delList.every(l=>selD.has(l.id))});
if($("selAll"))$("selAll").onchange=e=>{delList.forEach(l=>e.target.checked?selD.add(l.id):selD.delete(l.id));main()};
if($("delSel"))$("delSel").onclick=async()=>{const ids=[...selD],ok=loans().filter(l=>ids.includes(l.id)&&canDel1(l)).map(l=>l.id);if(!ok.length)return;if(await dlg({title:t("delSel"),text:t("sureN").replace("{n}",ok.length),ok:t("del"),danger:1})){store("loans",loans().filter(l=>!ok.includes(l.id)));selD.clear();main()}};
document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;acV=acV===b.dataset.ac?null:b.dataset.ac;main()});
document.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;acV=b.dataset.wd;main()});
document.querySelectorAll("[data-dep]").forEach(b=>b.onclick=async()=>{if(!isAdmin())return;const u=users(),x=u.find(z=>z.name===b.dataset.dep);if(!x)return;
if(x.cap===undefined){await dlg({title:t("dep")+" — "+x.name,text:t("setCapFirst")});return}
const v=await dlg({title:t("dep")+" — "+x.name,text:t("askDep"),fields:[{id:"a",label:t("sAmt"),num:1,req:1,msg:t("eAmt")},{id:"n",label:t("askNote"),value:""}],ok:t("saveB"),check:v=>v.a>0?"":t("eAmt")});if(!v)return;
x.tx=(x.tx||[]).concat([{ts:Date.now(),id:Date.now().toString(36),k:"dep",a:v.a,d:nowS(),n:v.n}]);store("users",u);main()});
if($("wdGo"))$("wdGo").onclick=async()=>{const n=$("wdGo").dataset.n,src=$("wdSrc").value,a=num($("wdAmt").value),nt=$("wdNote").value.trim(),e=$("wdErr");
if(!isAdmin()&&n!==cur)return;
if(!(a>0)){e.textContent=t("eAmt");return}
const lim=src==="profit"?profitAvail(n):capFree(n);if(a>lim+0.001){e.textContent=t("noFund")+": "+fmt(lim);return}
if(!await dlg({title:t("cfmWd"),text:fmt(a)+" "+t("cur")+" · "+(src==="profit"?t("srcP"):t("srcC"))+" · "+n+"\n"+(isAdmin()?t("wdNow"):t("wdNeeds")),ok:isAdmin()?t("doWd"):t("reqWd"),danger:1}))return;
const u=users(),x=u.find(z=>z.name===n);if(!x)return;const tx={ts:Date.now(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),k:"wd",a,d:nowS(),n:nt,src};if(!isAdmin())tx.pending=true;
x.tx=(x.tx||[]).concat([tx]);store("users",u);main()};
document.querySelectorAll("[data-wda],[data-wdr]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;const ok=b.dataset.wda!==undefined,[nm,id]=(ok?b.dataset.wda:b.dataset.wdr).split("|"),n=decodeURIComponent(nm),u=users(),x=u.find(z=>z.name===n),tx=x&&(x.tx||[]).find(q=>q.id===id);if(!tx)return;
if(ok){delete tx.pending;tx.d=nowS()}else x.tx=x.tx.filter(q=>q!==tx);
store("users",u);main()});
document.querySelectorAll("[data-pdl]").forEach(b=>b.onclick=()=>{const u=users(),x=u.find(z=>z.name===b.dataset.pdl);x.del=!x.del;store("users",u);main()});
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{const u=users(),x=u.find(z=>z.name===b.dataset.role);x.admin=!x.admin;store("users",u);main()});
document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=async()=>{if(!isAdmin())return;const n=decodeURIComponent(b.dataset.pw);const v=await dlg({title:t("pwFor")+": "+n,fields:[{id:"n",label:t("pwNew"),type:"password",req:1,msg:t("pwShort")},{id:"c",label:t("pwConf"),type:"password",req:1,msg:t("pwConf")}],ok:t("saveB"),check:v=>v.n.length<4?t("pwShort"):v.n!==v.c?t("pwMis"):""});if(!v)return;const u=users(),x=u.find(z=>z.name===n);if(!x)return;x.pw=await hash(v.n);store("users",u);await dlg({title:t("chPw"),text:"✔ "+t("pwDone")+" — "+n,ok:t("ok")})});
document.querySelectorAll("[data-du]").forEach(b=>b.onclick=async()=>{if(await dlg({title:t("del"),text:t("sure")+" — "+b.dataset.du,ok:t("del"),danger:1})){const n=b.dataset.du;store("users",users().filter(z=>z.name!==n).map(z=>Object.assign(z,{funds:(z.funds||[]).filter(f=>f!==n)})));store("loans",loans().filter(l=>l.owner!==n));main()}});
if($("sv")){
const calc=()=>{const a=num($("a").value)||0,r=num($("r").value)||0;$("tt").value=fmt(a+r)+" "+t("cur");if($("fu")){const v=avail($("fu").value);$("fb").textContent=v===null?"":t("bAvail")+": "+fmt(v)+" "+t("cur")}};
const fromDays=()=>{sD("dd",addD(gD("s"),Math.max(0,num($("d").value))));calc()};
let man=false;$("r").oninput=()=>{man=true;calc()};$("a").oninput=()=>{if(!man)$("r").value=Math.round((num($("a").value)||0)*10)/100;calc()};$("d").oninput=fromDays;if($("fu"))$("fu").onchange=calc;$("s").onchange=fromDays;
$("dd").onchange=()=>{$("d").value=Math.max(1,diff(gD("dd"),gD("s")))};
fromDays();
$("sv").onclick=()=>{const n=$("n").value.trim(),a=num($("a").value),r=num($("r").value)||0,s=gD("s"),due=gD("dd"),d=Math.max(1,diff(due,s));
const fe=m=>{$("fe").textContent=m};
if(!n){fe(t("eName"));$("n").focus();return}
if(!(a>0)){fe(t("eAmt"));$("a").focus();return}
const fnd=$("fu")?$("fu").value:allowedFunds()[0];if(!allowedFunds().includes(fnd))return;const av=avail(fnd);if(av!==null&&a>av+0.001){fe(t("eBal").replace("{n}",fmt(av)+" "+t("cur")));$("a").focus();return}
if(!(r>=0)){fe(t("eRepay"));$("r").focus();return}
if(!s||!due||due<s){fe(t("eDue"));$("dd").focus();return}
const all=loans();all.push({ts:Date.now(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),owner:cur,fund:fnd,name:(all.find(z=>z.owner===cur&&z.name.trim().toLowerCase()===n.toLowerCase())||{name:n}).name.trim(),amount:a,pct:Math.round(r/a*10000)/100,total:Math.round((a+r)*100)/100,days:d,start:s,due:due,paid:false});
store("loans",all);main();if($("n"))$("n").focus()}}
}
$("lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("lang",L)}catch(x){}cur?main():(setLang(),authView())};
$("pwb").onclick=async()=>{const m=me();if(!m)return;const v=await dlg({title:t("chPw"),fields:[{id:"o",label:t("pwOld"),type:"password",req:1,msg:t("pwOld")},{id:"n",label:t("pwNew"),type:"password",req:1,msg:t("pwShort")},{id:"c",label:t("pwConf"),type:"password",req:1,msg:t("pwConf")}],ok:t("saveB"),check:async v=>{if(v.n.length<4)return t("pwShort");if(v.n!==v.c)return t("pwMis");if(await hash(v.o)!==m.pw)return t("pwBad");return""}});if(!v)return;const u=users(),x=u.find(z=>z.name===cur);if(!x)return;x.pw=await hash(v.n);store("users",u);await dlg({title:t("chPw"),text:"✔ "+t("pwDone"),ok:t("ok")})};
$("out").onclick=()=>{cur=null;try{sessionStorage.removeItem("cur")}catch(e){}tab="loans";setLang();authView()};
(async()=>{await seed();try{cur=sessionStorage.getItem("cur")}catch(e){}cur&&me()?main():(cur=null,setLang(),authView())})();
</script>
</body>
</html>
